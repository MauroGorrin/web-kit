name: ci

on:
  push:
  pull_request:

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v6
        with:
          version: 12.4.1

      - uses: actions/setup-node@v7
        with:
          node-version-file: ".nvmrc"
          cache: "pnpm"

      - run: pnpm install --frozen-lockfile

      - run: pnpm exec playwright install --with-deps chromium

      - run: pnpm lint
      - run: pnpm format
      - run: pnpm typecheck
      - run: pnpm test

      - run: pnpm exec firebase emulators:exec --only firestore,auth "pnpm exec vitest run tests/rules"

      - run: pnpm build

      - run: pnpm test:e2e
        env:
          CI: true
