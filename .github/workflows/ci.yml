name: ci

on:
  push:
  pull_request:

# Mínimo necesario — este job solo builda/testea, nunca escribe al repo, a
# paquetes ni a PRs (ver CN-018 del reporte Cyber Neo).
permissions:
  contents: read

env:
  # Valores de prueba para el emulador de Firebase — NUNCA secretos reales.
  # CI corre siempre contra el emulador, nunca contra Firebase/Stripe/Resend
  # reales; ver .env.example para la lista completa de variables.
  CI: true
  FIRESTORE_EMULATOR_HOST: 127.0.0.1:8080
  FIREBASE_AUTH_EMULATOR_HOST: 127.0.0.1:9099
  FIREBASE_ADMIN_PROJECT_ID: web-kit-test
  NEXT_PUBLIC_FIREBASE_API_KEY: demo-api-key
  NEXT_PUBLIC_FIREBASE_AUTH_DOMAIN: web-kit-test.firebaseapp.com
  NEXT_PUBLIC_FIREBASE_PROJECT_ID: web-kit-test
  NEXT_PUBLIC_FIREBASE_STORAGE_BUCKET: web-kit-test.appspot.com
  NEXT_PUBLIC_FIREBASE_MESSAGING_SENDER_ID: "000000000000"
  NEXT_PUBLIC_FIREBASE_APP_ID: "1:000000000000:web:0000000000000000000000"
  RESEND_API_KEY: re_test_fake
  STRIPE_SECRET_KEY: sk_test_fake
  STRIPE_WEBHOOK_SECRET: whsec_fake

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    steps:
      # Acciones fijadas por SHA de commit, no por tag mutable — ver CN-017
      # del reporte Cyber Neo. Actualizar vía Dependabot (github-actions
      # ecosystem) o re-verificando el tag con `git ls-remote --tags`.
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - uses: pnpm/action-setup@d9184bf108216479bc5a137cc391f4d7b14c870b # v6.1.0
        with:
          version: 12.4.1

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: ".nvmrc"
          cache: "pnpm"

      - run: pnpm install --frozen-lockfile

      - run: pnpm exec playwright install --with-deps chromium

      - run: pnpm lint
      - run: pnpm format
      - run: pnpm typecheck
      - run: pnpm test

      - run: pnpm exec firebase emulators:exec --only firestore,auth "pnpm exec vitest run tests/rules"

      - run: pnpm build

      # `apps/template/e2e/tienda.spec.ts` siembra Sede/Producto vía SDK admin
      # antes de correr — necesita el emulador arriba durante todo el paso,
      # no solo durante el build.
      - run: pnpm exec firebase emulators:exec --only firestore,auth "pnpm test:e2e"
