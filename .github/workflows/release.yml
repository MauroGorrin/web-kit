name: release

on:
  push:
    branches: [main]

permissions:
  contents: write
  pull-requests: write
  packages: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      # Acciones fijadas por SHA de commit, no por tag mutable — ver CN-017
      # del reporte Cyber Neo. Actualizar vía Dependabot (github-actions
      # ecosystem) o re-verificando el tag con `git ls-remote --tags`.
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - uses: pnpm/action-setup@d9184bf108216479bc5a137cc391f4d7b14c870b # v6.1.0
        with:
          version: 12.4.1

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: ".nvmrc"
          cache: "pnpm"
          registry-url: "https://npm.pkg.github.com"
          scope: "@mgorrin"

      - run: pnpm install --frozen-lockfile

      - run: pnpm --filter @mgorrin/web-kit build

      - name: Create release PR or publish
        # Fijado por SHA — este step corre con un GITHUB_TOKEN de escritura y
        # también publica el paquete; un tag mutable acá es la peor acción
        # posible para dejar sin pinnear (ver CN-008 del reporte Cyber Neo).
        uses: changesets/action@66d7d1ddafddf1ef45f98ee51a7496f9cdadb2f4 # v2.1.2
        with:
          publish: pnpm release
          version: pnpm version-packages
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          NODE_AUTH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
