packages:
  - "packages/*"
  - "apps/*"

# El bundle del blueprint vive dentro del repo en blueprints/web-kit/ y NO debe
# resolverse como paquete del workspace ni como fuente de ningún tooling.

# Confirmado por ejecución real (smoke test): pnpm 12 bloquea por defecto los postinstall de
# paquetes nativos (ERR_PNPM_IGNORED_BUILDS) y las publicaciones muy recientes
# (ERR_PNPM_MINIMUM_RELEASE_AGE_VIOLATION). Sin esto, tanto el Bootstrap de §10 como el scaffold de
# create-next-app del paso 1 abortan a mitad de instalación — y create-next-app no sabe recuperarse
# solo de ese error (aborta su propio install sin reintentar). Preaprobar aquí evita ambos bloqueos
# antes de que ocurran, en vez de depender de `pnpm approve-builds` reactivo.
allowBuilds:
  "@firebase/util": true
  protobufjs: true
  unrs-resolver: true
  sharp: true
  # Dependencia opcional nativa de firebase-tools (emulator hub) — mismo
  # bloqueo ERR_PNPM_IGNORED_BUILDS, confirmado durante el primer deploy a
  # Vercel (build en Linux, nunca aparece en dev local en Windows).
  re2: true
minimumReleaseAgeExclude:
  - lucide-react@1.45.0
  - resend@6.28.0

# Fuerza versiones transitivas parcheadas — ver hallazgos CN-006/007/015/016
# del reporte Cyber Neo (`pnpm audit`). `postcss`/`sharp` llegan vía `next`;
# `uuid` vía `firebase-admin`.
#
# `stream-json` queda deliberadamente SIN override: forzarlo a >=3.5.0 rompe
# `firebase-tools` (`Cannot find module '.../stream-json/src/filters/Pick'`
# — el layout de exports cambió entre major versions). CN-016 es dev-only
# (emulador local, nunca llega a producción) y `firebase-tools` no tiene
# todavía una versión propia que traiga `stream-json` parcheado — repetir el
# intento cuando la libere.
overrides:
  postcss: ">=8.5.18"
  sharp: ">=0.35.4"
  uuid: ">=11.1.1"
  "@opentelemetry/core": ">=2.8.0"
  qs: ">=6.16.0"
  csv-parse: ">=7.0.2"
  # jose@6.x es ESM puro; jwks-rsa@4.1.0 (dependencia de firebase-admin/auth
  # para verificación vía JWKS) le hace un `require()` síncrono — rompe con
  # ERR_REQUIRE_ESM en el runtime de Vercel (nunca en dev local). jose dejó
  # de soportar CJS recién en la v5 — se pinnea SOLO bajo jwks-rsa (scoped)
  # para no tocar el jose@6 que usa otro paquete distinto en el árbol.
  "jwks-rsa>jose": "^4.15.9"
